 <circle cx="125" cy="892" r="22" fill="#c3162b"/><text x="125" y="903" fill="#fff" text-anchor="middle" font-size="26" font-weight="900">3</text><text x="175" y="904" font-size="31" font-weight="700">SQUEEZE THE HANDLE</text>
 <circle cx="125" cy="967" r="22" fill="#c3162b"/><text x="125" y="978" fill="#fff" text-anchor="middle" font-size="26" font-weight="900">4</text><text x="175" y="979" font-size="31" font-weight="700">SWEEP SIDE TO SIDE</text>
