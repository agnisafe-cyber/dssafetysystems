 <circle cx="125" cy="742" r="22" fill="#c3162b"/><text x="125" y="753" fill="#fff" text-anchor="middle" font-size="26" font-weight="900">1</text><text x="175" y="754" font-size="31" font-weight="700">PULL THE PIN</text>
