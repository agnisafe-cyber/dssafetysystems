/* Product detail overlay */
    .product-detail-overlay{
      position:fixed;inset:0;z-index:2000;display:grid;place-items:center;
      padding:34px;opacity:0;visibility:hidden;pointer-events:none;
      background:rgba(8,8,8,.68);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      transition:opacity .35s ease,visibility .35s ease;
    }
    .product-detail-overlay.open{opacity:1;visibility:visible;pointer-events:auto}
    .product-detail-modal{
      position:relative;width:min(1220px,100%);max-height:min(820px,calc(100svh - 68px));overflow:auto;
      display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:0;
      background:#f7f5f0;border:1px solid rgba(255,255,255,.22);border-radius:30px;
      box-shadow:0 45px 120px rgba(0,0,0,.58),0 8px 30px rgba(0,0,0,.2);
      transform:translateY(28px) scale(.965);
      transition:transform .6s cubic-bezier(.22,1,.36,1);scrollbar-width:thin;
    }
    .product-detail-modal:before{
      content:"";position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:30px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 -80px 120px rgba(0,0,0,.025);
    }
    .product-detail-overlay.open .product-detail-modal{transform:translateY(0) scale(1)}

    /* ============================================================
       02 — HERO STYLES
       ============================================================ */
    .hero{min-height:100svh;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr;column-gap:32px;align-items:center;background:radial-gradient(ellipse at 76% 42%,rgba(220,38,38,.18),transparent 34%),radial-gradient(ellipse at 91% 14%,rgba(255,105,75,.10),transparent 28%),radial-gradient(ellipse at 34% 100%,rgba(245,245,245,.055),transparent 38%),linear-gradient(118deg,#090b0f 0%,#111318 48%,#0b0d11 100%)}
    .hero-grid{position:absolute;inset:0;background:none!important;opacity:0!important;pointer-events:none}
    .hero-content{position:relative;z-index:8;grid-column:1;grid-row:1;align-self:center;padding:120px 0 80px 5vw;max-width:820px}
    .hero-content h1.hero-title{
      display:block!important;width:100%!important;max-width:1100px!important;
      margin:25px 0 0!important;font-family:"Google Sans Flex",sans-serif!important;
      font-size:48px!important;line-height:1.15!important;opacity:1!important;visibility:visible!important;letter-spacing:-1.5px!important;
      font-weight:600!important;color:#111827!important;
      white-space:normal!important;
    }
    .hero-content h1.hero-title .hero-line{display:block!important;opacity:1!important;visibility:visible!important;transform:none;will-change:auto;}
    .hero-content h1.hero-title .hero-line{animation:heroEnter .7s cubic-bezier(.22,1,.36,1) both!important;}
    .hero-content h1.hero-title .hero-line:nth-child(1){animation-delay:.15s!important;}
    .hero-content h1.hero-title .hero-line:nth-child(2){animation-delay:.3s!important;}
    @keyframes heroEnter{from{opacity:0;transform:translate(24px,24px);filter:blur(5px)}to{opacity:1;transform:translate(0,0);filter:blur(0)}}
    
    /* Smooth multi-stop gradient matching the screenshot preview */
    .hero-content h1.hero-title .highlight-red-orange {
      background: linear-gradient(110deg, #111827 0%, #253247 25%, #dc2626 65%, #f97316 100%)!important;
      -webkit-background-clip: text!important;
      background-clip: text!important;
      -webkit-text-fill-color: transparent!important;
    }
    
    /* Explore Products button */
    .animated-button{position:relative;display:flex;align-items:center;justify-content:center;box-sizing:border-box;gap:4px;padding:16px 36px;border:2px solid #dc2626;border-radius:12px;font-size:16px;background:#111;font-weight:600;color:#fff;box-shadow:none;cursor:pointer;overflow:hidden;transition:all .6s cubic-bezier(.23,1,.32,1)}
    .animated-button svg{position:absolute;width:24px;fill:#dc2626;z-index:9;transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button .arr-1{right:16px}.animated-button .arr-2{left:-25%}
    .animated-button .circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;background-color:#dc2626;border-radius:50%;opacity:0;transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button .text{position:relative;z-index:1;transform:translateX(-12px);transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button:hover{box-shadow:0 0 0 12px transparent;color:#212121;border-radius:12px}
    .animated-button:hover .arr-1{right:-25%}.animated-button:hover .arr-2{left:16px}.animated-button:hover .text{transform:translateX(12px)}
    .animated-button:hover svg{fill:#212121}.animated-button:active{scale:.95;box-shadow:0 0 0 4px #dc2626}
    .animated-button:hover .circle{width:220px;height:220px;opacity:1}

    /* About image diagonal top-left reveal */

    .hero-copy .hero-copy-line{display:block!important;white-space:nowrap!important;}
    .actions{display:flex;gap:20px;margin-top:36px}
    .btn{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;

    .btn-outline{

    /* ============================================================
       03 — FIRE-SAFETY MARQUEE
       ============================================================ */
    .marquee{overflow:hidden!important;width:100%!important;padding:20px 0!important;background:#f4f0e8!important;font-family:"Poppins",sans-serif!important;}
    .marquee-track{display:flex!important;align-items:center!important;width:max-content!important;min-width:100%!important;gap:0!important;white-space:nowrap!important;font-family:"Unbounded",sans-serif!important;font-size:22px!important;font-weight:750!important;letter-spacing:.2px!important;text-transform:uppercase!important;line-height:1!important;}

.marquee-track span:after{content:""!important;position:absolute!important;top:-40%!important;bottom:-40%!important;left:-55%!important;width:18%!important;z-index:9!important;pointer-events:none!important;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.25) 20%,#fff 50%,rgba(255,255,255,.25) 80%,transparent 100%)!important;transform:skewX(-20deg)!important;filter:drop-shadow(0 0 8px rgba(255,255,255,.95))!important;animation:dsMarqueeTextShine 3s linear infinite!important;}
@keyframes dsMarqueeTextShine{0%{left:-55%;opacity:0}10%{opacity:1}48%{left:145%;opacity:1}55%,100%{left:145%;opacity:0}}
    .marquee-track span:after{content:""!important;position:absolute!important;top:-15%!important;left:-120%!important;width:48%!important;height:130%!important;pointer-events:none!important;z-index:3!important;background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,.08) 34%,rgba(255,255,255,.9) 50%,rgba(255,255,255,.08) 66%,transparent 100%)!important;transform:skewX(-18deg)!important;animation:marqueeCardShine 3s ease-in-out infinite!important;}
    @keyframes marqueeCardShine{0%,55%{left:-120%;opacity:0}62%{opacity:1}100%{left:140%;opacity:0}}
    .marquee-track span:before{content:"•"!important;display:inline-block!important;margin-right:28px!important;color:#101010!important;font-family:"Unbounded",sans-serif!important;font-size:22px!important;font-weight:900!important;line-height:1!important;}

<div id="smooth-wrapper">

      <!-- Product catalog and quote form, placed after all existing site sections -->
      <section class="ds-products-embed" id="ds-products-embed" aria-label="Product catalog and request a quote">
        <iframe
          id="ds-products-embed-frame"
          class="ds-products-embed-frame"
          src="products-quote.html"
          title="DS Safety Systems Product Catalog and Request a Quote"
          loading="eager"
          scrolling="no"
          style="height:2200px"
        ></iframe>
      </section>
      <script>
        (() => {
          const frame = document.getElementById("ds-products-embed-frame");
          if (!frame) return;
          let resizeObserver;
          const fitFrame = () => {
            try {
              const doc = frame.contentDocument;
              if (!doc) return;
              const height = Math.max(
                doc.documentElement.scrollHeight,
                doc.body ? doc.body.scrollHeight : 0,
                doc.documentElement.offsetHeight,
                doc.body ? doc.body.offsetHeight : 0
              );
              if (height > 0) frame.style.height = (height + 8) + "px";
              if (resizeObserver) resizeObserver.disconnect();
              if (doc.documentElement && "ResizeObserver" in window) {
                resizeObserver = new ResizeObserver(fitFrame);
                resizeObserver.observe(doc.documentElement);
                if (doc.body) resizeObserver.observe(doc.body);
              }
            } catch (error) {
              /* Keep a usable fallback height if the embedded page cannot be measured. */
            }
          };
          frame.addEventListener("load", () => {
            fitFrame();
            [150, 500, 1200, 2500].forEach(delay => setTimeout(fitFrame, delay));
            try {
              const doc = frame.contentDocument;
              if (doc) {
                doc.addEventListener("load", fitFrame, true);
                const observer = new MutationObserver(fitFrame);
                observer.observe(doc.documentElement, { childList: true, subtree: true, attributes: true });
              }
            } catch (error) {}
          });
          window.addEventListener("resize", fitFrame);
        })();
      </script>
    </div>
  </div>

<script>
(()=>{
  const slider=document.querySelector(".manufacturing-slider");
  const viewport=slider?.querySelector(".manufacturing-slider-viewport");
  const prev=slider?.querySelector(".manufacturing-slider-prev");
  const next=slider?.querySelector(".manufacturing-slider-next");
  if(!viewport||!prev||!next||viewport.querySelector(".manufacturing-slider-side-arrow")) return;
  const make=(cls,label,html)=>{
    const b=document.createElement("button");b.type="button";b.className="manufacturing-slider-side-arrow "+cls;b.setAttribute("aria-label",label);b.innerHTML=html;return b;
  };
  const left=make("manufacturing-slider-side-prev","Previous manufacturing image","‹");
  const right=make("manufacturing-slider-side-next","Next manufacturing image","›");
  left.addEventListener("click",()=>prev.click());right.addEventListener("click",()=>next.click());
  viewport.append(left,right);
})();
</script>

<script id="ds-product-page-v1-js">
document.addEventListener("DOMContentLoaded",()=>{
  if(typeof gsap==="undefined") return;
  gsap.from(".ds-product-reveal",{
    duration:1,
    y:30,
    opacity:0,
    stagger:.2,
    ease:"power3.out"
  });
  if(typeof ScrollTrigger!=="undefined"){
    gsap.registerPlugin(ScrollTrigger);
    gsap.from(".ds-product-card",{
      scrollTrigger:{trigger:".ds-product-equipment",start:"top 80%"},
      duration:.8,
      y:50,
      opacity:0,
      stagger:.2,
      ease:"power3.out"
    });
  }
});
</script>
