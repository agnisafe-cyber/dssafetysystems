.nav{
  width:min(1280px,calc(100% - 48px));
  height:82px;
  padding:0 12px 0 20px;
  top:20px;
  border:1px solid rgba(16,16,16,.09);
  border-radius:24px;
  background:rgba(250,247,241,.76);
  backdrop-filter:blur(28px) saturate(1.35);
  -webkit-backdrop-filter:blur(28px) saturate(1.35);
  box-shadow:0 20px 70px rgba(16,16,16,.11);
  overflow:visible;
}
.nav:before{
  content:"";
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(110deg,rgba(255,255,255,.7),rgba(217,56,48,.15),rgba(255,255,255,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.brand{gap:13px;font-size:16px;letter-spacing:-.5px;position:relative;z-index:2}
.brand-logo{width:52px;height:52px}
.brand-text{gap:1px}
.brand-text small{font-size:7.5px;letter-spacing:1.8px;color:#817c74}
.nav-links{gap:2px;margin-right:10px;position:relative;z-index:2}
.nav-links a{padding:12px 15px;font-size:12.5px;letter-spacing:.1px}
.nav-links a:not(.nav-cta):after{left:15px;right:15px;bottom:6px;height:1.5px}
.nav-links a:not(.nav-cta):before{
  content:"";
  position:absolute;inset:4px;
  border-radius:10px;
  background:rgba(217,56,48,.055);
  transform:scale(.8);opacity:0;
  transition:.25s ease;
}
.nav-links a:not(.nav-cta):hover:before{transform:scale(1);opacity:1}
.nav-links a:not(.nav-cta):after{z-index:2}
.nav-cta{
  margin-left:8px;
  padding:13px 20px!important;
  border-radius:999px;
  background:#111;
  box-shadow:0 8px 22px rgba(16,16,16,.16);
}
.nav-cta:hover{box-shadow:0 10px 26px rgba(217,56,48,.22)}
.menu{
  width:46px;height:46px;border-radius:14px;
  box-shadow:0 8px 22px rgba(16,16,16,.12);
}
.nav.nav-scrolled{height:66px;background:rgba(250,247,241,.9);box-shadow:0 18px 55px rgba(16,16,16,.15)}
@media(max-width:900px){
  .nav{width:calc(100% - 24px);height:68px;top:12px;padding:0 8px 0 12px;border-radius:19px}
  .brand-logo{width:43px;height:43px}
  .brand{font-size:14px;gap:9px}
  .brand-text small{font-size:6.5px;letter-spacing:1.45px}
  .menu{width:43px;height:43px}
  .nav-links.mobile-open{
    top:78px;
    left:0;right:0;
    padding:10px;
    gap:4px;
    border-radius:20px;
    background:rgba(250,247,241,.96);
    backdrop-filter:blur(25px);
  }
  .nav-links.mobile-open a{padding:14px 15px}
  .nav-links.mobile-open .nav-cta{margin:5px 0 0}
}
