<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f0e8;--ink:#101010;--muted:#6d6962;--red:#d93830;--line:rgba(16,16,16,.12)}
html{scroll-behavior:smooth}
body{font-family:"Google Sans Flex",sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{font:inherit}
::selection{background:var(--red);color:#fff}
.nav{height:82px;position:fixed;z-index:50;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;mix-blend-mode:multiply}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;letter-spacing:-.5px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--red);display:grid;place-items:center}
.brand-mark:after{content:"";width:9px;height:9px;background:#f4f0e8;border-radius:50%}
.nav-links{display:flex;align-items:center;gap:30px;font-size:14px;font-weight:550}
.nav-links a{transition:.25s}
.nav-links a:hover{color:var(--red)}
.nav-cta{background:#111;color:#fff;padding:12px 19px;border-radius:99px}
.nav-cta:hover{background:var(--red)!important;color:#fff!important}
.menu{display:none;border:0;background:transparent;font-size:24px}
.hero{min-height:100svh;position:relative;overflow:hidden;display:flex;align-items:center}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(16,16,16,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(16,16,16,.035) 1px,transparent 1px);background-size:70px 70px;mask-image:linear-gradient(to bottom,#000 0%,transparent 85%);opacity:.65}
.hero-content{position:relative;z-index:8;padding:120px 5vw 80px;max-width:850px}
.kicker{display:flex;align-items:center;gap:10px;text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;color:#5e5a54;opacity:0}
.kicker i{display:block;width:30px;height:1px;background:var(--red)}
h1{font-size:clamp(62px,9.4vw,144px);line-height:.84;letter-spacing:-7px;font-weight:650;margin-top:25px;max-width:800px}
h1 em{font-style:normal;color:var(--red)}
.hero-copy{font-size:17px;line-height:1.55;color:var(--muted);max-width:410px;margin-top:34px;opacity:0}
.actions{display:flex;gap:11px;margin-top:28px;opacity:0}
.btn{padding:15px 22px;border-radius:99px;font-size:14px;font-weight:650;transition:.3s}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#b92c26;transform:translateY(-2px)}
.btn-outline{border:1px solid var(--line)}.btn-outline:hover{background:#111;color:#fff}
#scene{position:absolute;inset:0;z-index:4;pointer-events:none}
.glow{position:absolute;z-index:2;width:500px;height:500px;border-radius:50%;right:9%;top:50%;transform:translateY(-50%);background:rgba(217,56,48,.09);filter:blur(85px)}
.hero-meta{position:absolute;z-index:9;left:5vw;right:5vw;bottom:28px;display:flex;justify-content:space-between;color:#78736b;font-size:10px;letter-spacing:1.6px;text-transform:uppercase}
.dot{display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;margin-right:9px}
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 0;white-space:nowrap}
.marquee-track{display:inline-flex;gap:45px;min-width:max-content;font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:650}
.marquee-track span:after{content:"•";color:var(--red);margin-left:45px}
.section{padding:130px 5vw}
.dark{background:#111;color:#fff}
.section-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#89847b;font-weight:650;margin-bottom:28px}
.dark .section-label{color:#858078}
.statement{font-size:clamp(42px,6.5vw,92px);line-height:.94;letter-spacing:-4px;font-weight:600;max-width:1050px}
.statement span{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.12);margin-top:80px}
.card{background:#111;padding:35px;min-height:270px;display:flex;flex-direction:column;justify-content:space-between}
.card-num{font-size:11px;color:#777;letter-spacing:1px}.card h3{font-size:27px;letter-spacing:-1px}.card p{color:#92908b;font-size:14px;line-height:1.6;max-width:280px}.card-arrow{color:var(--red);font-size:24px}
.products{background:var(--bg)}
.product-intro{display:flex;justify-content:space-between;gap:40px;align-items:end}
.product-intro h2{font-size:clamp(42px,6vw,80px);letter-spacing:-4px;line-height:.92}
.product-intro p{max-width:330px;color:var(--muted);line-height:1.55;font-size:15px}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:55px}
.product{min-height:360px;background:#ebe6dc;border:1px solid rgba(16,16,16,.08);padding:28px;position:relative;overflow:hidden;transition:transform .35s}
.product:hover{transform:translateY(-7px)}
.product-num{font-size:11px;color:#777}.product h3{font-size:25px;letter-spacing:-1px;position:absolute;bottom:27px;left:28px;right:28px}
.product-visual{height:180px;display:grid;place-items:center;font-size:75px;filter:drop-shadow(0 20px 25px rgba(0,0,0,.12))}
.product-link{position:absolute;top:26px;right:26px;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.footer{padding:35px 5vw;display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);font-size:12px;color:#777}
@media(max-width:900px){
.nav{height:70px;padding:0 22px}.nav-links{display:none}.menu{display:block}.brand{font-size:16px}
.hero-content{padding:110px 22px 90px}h1{font-size:clamp(57px,15vw,100px);letter-spacing:-5px;max-width:650px}
.hero-copy{font-size:15px;max-width:310px}.glow{width:330px;height:330px;right:-15%;top:62%}
.hero-meta{left:22px;right:22px;bottom:20px}.section{padding:95px 22px}.cards,.product-grid{grid-template-columns:1fr}.cards{margin-top:55px}.card{min-height:220px}.product{min-height:320px}
.product-intro{display:block}.product-intro p{margin-top:25px}.footer{padding:25px 22px;flex-direction:column}
}
@media(max-width:600px){
.hero{min-height:100svh}.hero-grid{background-size:45px 45px}#scene{transform:translateY(8%)}
.actions{flex-wrap:wrap}.btn{padding:13px 18px}.statement{letter-spacing:-2.5px}
}
</style>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const container=document.getElementById("scene");
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);
camera.position.set(0,.1,7);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfff8ed,0x161616,2.2));
const key=new THREE.DirectionalLight(0xffffff,4.2);
key.position.set(-3,5,5);scene.add(key);
const red=new THREE.PointLight(0xd93830,13,8);
red.position.set(3,0,3);scene.add(red);
const rim=new THREE.DirectionalLight(0xffd7d2,3);
rim.position.set(4,2,-4);scene.add(rim);

let model;
const loader=new GLTFLoader();
loader.load("./assets/extinguisher.glb",g=>{
 model=g.scene;
 model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 scene.add(model);
 const box=new THREE.Box3().setFromObject(model);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());
 model.position.sub(center);
 const max=Math.max(size.x,size.y,size.z);
 const base=2.65/max;
 model.scale.setScalar(base);
 model.position.set(innerWidth<600?1.0:innerWidth<900?1.25:1.55,-.2,0);
 gsap.fromTo(model.scale,{x:base*.72,y:base*.72,z:base*.72},{x:base,y:base,z:base,duration:1.5,ease:"power4.out"});
 gsap.fromTo(model.position,{x:4.2},{x:innerWidth<600?1.0:innerWidth<900?1.25:1.55,duration:1.5,ease:"power4.out"});
},undefined,e=>console.error(e));

let mx=0,my=0;
addEventListener("mousemove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
const clock=new THREE.Clock();
function tick(){
 requestAnimationFrame(tick);
 const t=clock.getElapsedTime();
 if(model){
  model.position.y=-.2+Math.sin(t*1.15)*.055;
  model.rotation.y+=.0015;
  model.rotation.x+=(my*.1-model.rotation.x)*.035;
  model.rotation.z+=(mx*.08-model.rotation.z)*.035;
 }
 renderer.render(scene,camera);
}
tick();

function resize(){
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 if(model){
  model.position.x=innerWidth<600?1.0:innerWidth<900?1.25:1.55;
  model.scale.setScalar(((()=>{const b=new THREE.Box3().setFromObject(model);return Math.max(...[b.max.x-b.min.x,b.max.y-b.min.y,b.max.z-b.min.z])})()>0?model.scale.x:model.scale.x);
 }
}
addEventListener("resize",resize);
</script>
