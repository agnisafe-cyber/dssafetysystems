  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f4f0e8;--ink:#101010;--muted:#6d6962;--red:#d93830;--line:rgba(16,16,16,.12)}
    html{scroll-behavior:auto}
    body{font-family:"Google Sans Flex",sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}

    button{font:inherit}

    /* ============================================================
       01 — NAVIGATION
       ============================================================ */
    .nav{
      position:fixed;z-index:50;top:22px;left:50%;transform:translateX(-50%);
      width:min(1280px,calc(100% - 40px));height:82px;padding:0 22px;
      display:flex;align-items:center;justify-content:space-between;
      background:rgba(244,240,232,.88);border:none;
      border-radius:20px;box-shadow:0 12px 38px rgba(16,16,16,.08);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      font-family:"Poppins",sans-serif!important;
    }
    .brand{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700;letter-spacing:-.6px;min-width:max-content!important;}
    .brand-logo{width:50px;height:50px;object-fit:contain}
    .brand-text{
      font-family:"Poppins",sans-serif!important;
      font-size:26px!important;
      font-weight:750!important;
      letter-spacing:-1.15px!important;
      line-height:1!important;
      white-space:nowrap!important;
      background:linear-gradient(90deg,#d93830 0%,#101010 68%,#101010 100%)!important;
      -webkit-background-clip:text!important;
      background-clip:text!important;
      -webkit-text-fill-color:transparent!important;
      color:transparent!important;
    }
    .nav-links{display:flex;align-items:center;gap:6px;margin-left:auto}
    .nav-links a{font-family:"Poppins",sans-serif!important;font-size:14px;font-weight:600;padding:12px 16px;border-radius:9px;position:relative;transition:.25s}
    .nav-links a:not(.nav-cta):hover{background:rgba(16,16,16,.055);color:var(--red)}
    .nav-links a:not(.nav-cta):after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:1.5px;background:var(--red);transform:scaleX(0);transition:.25s}
    .nav-links a:not(.nav-cta):hover:after{transform:scaleX(1)}
    .nav-cta{background:#111;color:#fff!important;border-radius:999px!important;padding:13px 21px!important;margin-left:7px}
    .nav-cta:hover{background:var(--red)!important;transform:translateY(-1px)}
    .menu{display:none}

    /* ============================================================
       05 — SERVICES STYLES
       ============================================================ */
    .services-home{background:#111;position:relative;overflow:hidden;padding-top:125px;padding-bottom:125px;color:#fff}
    .services-home:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(220,38,38,.12),transparent 38%,transparent 72%,rgba(255,255,255,.025));pointer-events:none}
    .services-topline{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:18px}
    .services-topline .section-label{color:#fff!important;opacity:1!important;transform:none!important;filter:none!important}
    .services-topline>span{font-family:"Poppins",sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:#dc2626}
    .services-hero-copy{position:relative;z-index:1;display:grid;grid-template-columns:1.25fr .75fr;gap:80px;align-items:end;padding:55px 0 70px;opacity:0;transform:translateX(-55px);filter:blur(6px);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1),filter 1s cubic-bezier(.22,1,.36,1)}
.services-home.revealed .services-hero-copy{opacity:1;transform:translateY(0);filter:blur(0)}
    .services-hero-copy h2{font-family:"Poppins",sans-serif;font-size:clamp(46px,5.2vw,76px);line-height:.98;letter-spacing:-3.2px;font-weight:800;margin:0;color:#f7f5f0;max-width:850px}
    .services-hero-copy h2 span{color:#dc2626}
    .services-hero-copy p{font-size:17px;line-height:1.75;color:#aeb1b7;max-width:470px;margin:0 0 4px}
    .services-list{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.14)}
    .service-row{display:grid;grid-template-columns:90px 1fr 70px;align-items:center;min-height:170px;border-bottom:1px solid rgba(255,255,255,.14);opacity:0;transform:translateX(-55px);filter:blur(5px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1),filter 1s cubic-bezier(.22,1,.36,1),background .35s ease}
    .services-list.revealed .service-row{opacity:1;transform:translate(0,0);filter:blur(0)}
    .services-list.revealed .service-row:nth-child(1){transition-delay:.04s}.services-list.revealed .service-row:nth-child(2){transition-delay:.13s}.services-list.revealed .service-row:nth-child(3){transition-delay:.22s}.services-list.revealed .service-row:nth-child(4){transition-delay:.31s}
    .service-row:hover{background:rgba(255,255,255,.035)}
    .service-row-num{font-family:"Poppins",sans-serif;font-size:13px;font-weight:700;color:#dc2626;align-self:start;padding-top:28px}
    .service-row-main{padding:27px 25px 27px 0}
    .service-kicker{font-family:"Poppins",sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;color:#73777f;margin-bottom:9px}
    .service-row h3{font-family:"Poppins",sans-serif;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.8px;color:#f7f5f0;margin:0 0 9px}
    .service-row p{font-size:15px;line-height:1.65;color:#979ba3;max-width:680px;margin:0}
    .service-row-arrow{width:48px;height:48px;border:1px solid rgba(255,255,255,.2);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;transition:.3s ease}
    .service-row:hover .service-row-arrow{background:#dc2626;border-color:#dc2626;transform:rotate(45deg)}

    /* ============================================================
       06 — PRODUCTS STYLES
       ============================================================ */
    .products{position:relative;background:#f4f0e8;padding-top:130px;padding-bottom:130px;overflow:hidden}
    .products-home-head{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:80px;align-items:end;margin-bottom:72px}
    .products-home-head .section-label{margin-bottom:18px;color:#d93830}
    .products-home-head h2{font-family:"Poppins",sans-serif;font-size:clamp(44px,5.4vw,78px);line-height:.98;letter-spacing:-3px;font-weight:800;max-width:820px}
    .products-home-head h2 span{color:#d93830}
    .products-home-copy{max-width:470px;justify-self:end}
    .products-home-copy p{font-size:17px;line-height:1.75;color:#6d6962;margin-bottom:25px}
    .products-home-link{display:inline-flex;align-items:center;gap:12px;font-family:"Poppins",sans-serif;font-size:13px;font-weight:700;border-bottom:1px solid #111;padding-bottom:8px;transition:.3s ease}
    .products-home-link:hover{color:#d93830;border-color:#d93830;transform:translateX(5px)}
    .products-home-grid{position:relative;border-top:1px solid rgba(16,16,16,.16)}
    .product-home-row{display:grid;grid-template-columns:90px 1fr 70px;align-items:center;min-height:145px;border-bottom:1px solid rgba(16,16,16,.16);transition:background .35s ease,padding .4s cubic-bezier(.22,1,.36,1)}
    .product-home-row:hover{background:rgba(217,56,48,.045);padding-left:12px}
    .product-home-num{align-self:start;padding-top:28px;font-family:"Poppins",sans-serif;font-size:12px;font-weight:700;color:#d93830}
    .product-home-main{padding:25px 25px 25px 0}
    .product-home-kicker{font-family:"Poppins",sans-serif;font-size:9px;font-weight:700;letter-spacing:.16em;color:#98938a;margin-bottom:8px}
    .product-home-main h3{font-family:"Poppins",sans-serif;font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.7px;margin-bottom:8px}
    .product-home-main p{font-size:14px;line-height:1.6;color:#77726a;max-width:700px}
    .product-home-arrow{width:48px;height:48px;border:1px solid rgba(16,16,16,.18);border-radius:50%;display:grid;place-items:center;font-size:21px;transition:.35s ease}
    .product-home-row:hover .product-home-arrow{background:#d93830;border-color:#d93830;color:#fff;transform:rotate(45deg)}
    /* Premium product experience — expanded three-viewport Products section */
    .products{
      min-height:300vh;
      padding-top:150px;
      padding-bottom:150px;
    }
    .products-home-head{
      min-height:62vh;
      align-items:center;
      margin-bottom:70px;
    }
    .products-home-head h2{
      font-size:clamp(48px,6.2vw,92px);
    }
    .products-home-grid{
      min-height:132vh;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:18px;
      align-content:start;
    }
    .product-home-row{
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      min-height:390px;
      padding:34px!important;
      border:1px solid rgba(16,16,16,.13)!important;
      border-radius:20px;
      background:rgba(255,255,255,.34);
      overflow:hidden;
      opacity:0;
      transform:translateY(60px) scale(.975);
      filter:blur(5px);
      transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1),filter .9s cubic-bezier(.22,1,.36,1),background .35s ease,border-color .35s ease,box-shadow .35s ease;
      cursor:pointer;
      text-align:left;
      color:inherit;
    }
    .products-home-grid.revealed .product-home-row{
      opacity:1;
      transform:translateY(0) scale(1);
      filter:blur(0);
    }
    .products-home-grid.revealed .product-home-row:nth-child(1){transition-delay:.03s}
    .products-home-grid.revealed .product-home-row:nth-child(2){transition-delay:.11s}
    .products-home-grid.revealed .product-home-row:nth-child(3){transition-delay:.19s}
    .products-home-grid.revealed .product-home-row:nth-child(4){transition-delay:.27s}
    .products-home-grid.revealed .product-home-row:nth-child(5){transition-delay:.35s}
    .products-home-grid.revealed .product-home-row:nth-child(6){transition-delay:.43s}
    .product-home-row:before{
      content:"";position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(217,56,48,.08),transparent 44%);
      opacity:0;transition:opacity .4s ease;pointer-events:none;
    }
    .product-home-row:hover,.product-home-row.active{
      background:#fff;
      border-color:rgba(217,56,48,.3)!important;
      box-shadow:0 22px 60px rgba(16,16,16,.1);
      transform:translateY(-7px)!important;
    }
    .product-home-row:hover:before,.product-home-row.active:before{opacity:1}
    .product-home-row:focus-visible{outline:2px solid #d93830;outline-offset:4px}
    .product-home-row.active .product-home-arrow{
      background:#d93830;border-color:#d93830;color:#fff;transform:rotate(45deg);
    }
    .product-home-num{position:relative;z-index:1;align-self:auto;padding:0;font-family:"Poppins",sans-serif;font-size:11px;font-weight:700;color:#d93830}
    .product-home-main{position:relative;z-index:1;padding:0!important;margin-top:auto}
    .product-home-kicker{font-family:"Poppins",sans-serif;font-size:9px;font-weight:700;letter-spacing:.16em;color:#98938a;margin-bottom:13px}
    .product-home-main h3{font-family:"Poppins",sans-serif;font-size:31px;line-height:1.08;font-weight:700;letter-spacing:-.8px;margin-bottom:13px}
    .product-home-main p{font-size:14px;line-height:1.65;color:#77726a;max-width:650px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
    .product-home-arrow{position:relative;z-index:2;align-self:flex-end;width:48px;height:48px;margin-top:25px;border:1px solid rgba(16,16,16,.18);border-radius:50%;display:grid;place-items:center;font-size:21px;transition:.35s ease}
    .product-home-row:hover .product-home-arrow{background:#d93830;border-color:#d93830;color:#fff;transform:rotate(45deg)}
    .product-inline-detail{
      position:relative;
      margin-top:20px;
      max-height:0;
      overflow:hidden;
      opacity:0;
      transform:translateY(18px);
      border:1px solid transparent;
      border-radius:22px;
      transition:max-height .7s cubic-bezier(.22,1,.36,1),opacity .4s ease,transform .7s cubic-bezier(.22,1,.36,1),padding .7s cubic-bezier(.22,1,.36,1),border-color .4s ease;
    }
    .product-inline-detail.open{
      max-height:620px;
      opacity:1;
      transform:translateY(0);
      padding:42px;
      border-color:rgba(217,56,48,.24);
      background:#111;
      color:#f7f5f0;
    }
    .product-detail-index{
      font-family:"Poppins",sans-serif;
      font-size:10px;
      font-weight:700;
      letter-spacing:.16em;
      color:#dc2626;
      margin-bottom:18px;
    }
    .product-detail-body{max-width:980px}
    .product-detail-kicker{
      font-family:"Poppins",sans-serif;font-size:9px;font-weight:700;
      letter-spacing:.16em;color:#777c84;margin-bottom:13px;
    }
    .product-detail-body h3{
      font-family:"Poppins",sans-serif;font-size:clamp(34px,4vw,58px);
      line-height:1;letter-spacing:-2px;font-weight:700;margin-bottom:18px;
    }
    .product-detail-desc{max-width:760px;color:#aeb1b7;font-size:16px;line-height:1.7}
    .product-detail-columns{
      display:grid;grid-template-columns:1fr 1fr;gap:60px;
      margin-top:36px;padding-top:25px;border-top:1px solid rgba(255,255,255,.14);
    }
    .product-detail-columns span{
      display:block;font-family:"Poppins",sans-serif;font-size:9px;font-weight:700;
      letter-spacing:.16em;color:#777c84;margin-bottom:14px;
    }
    .product-detail-columns ul{list-style:none;display:grid;gap:9px}
    .product-detail-columns li{font-size:14px;color:#f0eee8}
    .product-detail-columns li:before{content:"+";color:#dc2626;margin-right:9px}
    .product-detail-columns strong{font-size:15px;line-height:1.6;color:#f0eee8;font-weight:500;display:block;max-width:390px}
    .product-detail-close{
      margin-top:34px;padding:12px 0;border:0;border-bottom:1px solid rgba(255,255,255,.3);
      background:transparent;color:#fff;font-family:"Poppins",sans-serif;font-size:11px;font-weight:700;cursor:pointer;
      transition:.3s ease;
    }
    .product-detail-close:hover{color:#dc2626;border-color:#dc2626;transform:translateX(5px)}
    @media(max-width:900px){
      .products{min-height:auto;padding-top:95px;padding-bottom:95px}
      .products-home-head{min-height:0;grid-template-columns:1fr;gap:25px;margin-bottom:55px}
      .products-home-head h2{font-size:42px;letter-spacing:-1.8px}
      .products-home-grid{min-height:0;grid-template-columns:1fr;gap:12px}
      .product-home-row{min-height:300px!important;padding:27px!important}
      .product-home-main h3{font-size:25px}
      .product-inline-detail.open{padding:28px 24px}
      .product-detail-body h3{font-size:34px;letter-spacing:-1.2px}
      .product-detail-columns{grid-template-columns:1fr;gap:28px}
    }

    /* First product card two-line title */
.products .shell .wsk-cp-product:first-child .title-product h3{white-space:normal!important;line-height:1.12!important;}
.products .shell .wsk-cp-product:first-child .title-product h3 span,
.products .shell .wsk-cp-product:first-child .title-product h3 small{display:block!important;}
.products .shell .wsk-cp-product:first-child .title-product h3 small{font-size:15px!important;font-weight:500!important;color:#77726a!important;margin-top:5px!important;}

/* Product detail overlay */
    .product-detail-overlay{
      position:fixed;inset:0;z-index:2000;display:grid;place-items:center;
      padding:34px;opacity:0;visibility:hidden;pointer-events:none;
      background:rgba(8,8,8,.68);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      transition:opacity .35s ease,visibility .35s ease;
    }
    .product-detail-overlay.open{opacity:1;visibility:visible;pointer-events:auto}
    .product-detail-modal{
      position:relative;width:min(1220px,100%);max-height:min(820px,calc(100svh - 68px));overflow:auto;
      display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:0;
      background:#f7f5f0;border:1px solid rgba(255,255,255,.22);border-radius:30px;
      box-shadow:0 45px 120px rgba(0,0,0,.58),0 8px 30px rgba(0,0,0,.2);
      transform:translateY(28px) scale(.965);
      transition:transform .6s cubic-bezier(.22,1,.36,1);scrollbar-width:thin;
    }
    .product-detail-modal:before{
      content:"";position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:30px;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 -80px 120px rgba(0,0,0,.025);
    }
    .product-detail-overlay.open .product-detail-modal{transform:translateY(0) scale(1)}
    .product-detail-gallery{padding:24px;display:flex;flex-direction:column;gap:13px;min-width:0;position:relative;background:#111}
    .product-detail-gallery:before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.07),transparent 34%),linear-gradient(145deg,#171717,#0d0d0d);
    }
    .product-detail-main-image{
      position:relative;min-height:620px;height:620px;z-index:1;
      border-radius:18px 18px 18px 30px;
      overflow:hidden;background:#242424;
      box-shadow:0 28px 55px rgba(0,0,0,.4);
    }
    .product-detail-main-image:before{
      content:"";position:absolute;z-index:2;left:0;right:0;bottom:0;height:28%;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.28));
      pointer-events:none;
    }
    .product-detail-main-image:after{
      content:"";position:absolute;z-index:3;inset:0;pointer-events:none;
      border:1px solid rgba(255,255,255,.12);border-radius:18px 18px 18px 30px;
      box-shadow:inset 0 0 45px rgba(0,0,0,.14);
    }
    .product-detail-main-image{isolation:isolate}
    .product-detail-main-image img{
      width:100%;height:100%;min-height:620px;display:block;object-fit:cover;
      transform:translateX(0) scale(1.015);
      transition:transform .58s cubic-bezier(.22,1,.36,1);
      will-change:transform;
    }
    .product-detail-slide-layer{
      position:absolute!important;inset:0;width:100%!important;height:100%!important;
      min-height:0!important;z-index:1;transform:translateX(100%);
      transition:transform .58s cubic-bezier(.22,1,.36,1);
      object-fit:cover;
    }
    .product-detail-main-image.zoomed img{transition:transform .45s cubic-bezier(.22,1,.36,1)}
    .product-detail-main-image.zoomed .product-detail-slide-layer{transition:none}

    .product-detail-main-image:hover img{transform:scale(1.045)}
    .product-detail-main-image.zoomed img{transform:scale(1.18);cursor:zoom-out}
    .product-detail-main-image img{cursor:zoom-in;transform-origin:center center}
    .product-detail-slider-btn{
      position:absolute;z-index:7;top:50%;transform:translateY(-50%);
      width:48px;height:48px;border:1px solid rgba(255,255,255,.22);border-radius:50%;
      background:rgba(15,15,15,.46);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      color:#fff;display:grid;place-items:center;font-size:25px;font-weight:300;
      cursor:pointer;transition:transform .35s cubic-bezier(.22,1,.36,1),background .25s ease,border-color .25s ease;
      box-shadow:0 8px 24px rgba(0,0,0,.22);
    }
    .product-detail-slider-btn:hover{background:rgba(217,56,48,.9);border-color:rgba(255,255,255,.35);transform:translateY(-50%) scale(1.08)}
    .product-detail-slider-prev{left:18px}.product-detail-slider-next{right:18px}
    .product-detail-slider-count{
      position:absolute;z-index:7;right:18px;bottom:18px;padding:7px 11px;
      border:1px solid rgba(255,255,255,.22);border-radius:999px;
      background:rgba(0,0,0,.4);backdrop-filter:blur(12px);color:#fff;
      font-family:"Poppins",sans-serif;font-size:9px;font-weight:700;letter-spacing:.14em;
    }

    /* ============================================================
       02 — HERO STYLES
       ============================================================ */
    .hero{min-height:100svh;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr;column-gap:32px;align-items:center;background:radial-gradient(circle at 76% 48%,rgba(217,56,48,.055),transparent 24%)}
    .hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(16,16,16,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(16,16,16,.035) 1px,transparent 1px);background-size:70px 70px;mask-image:linear-gradient(to bottom,#000 0%,transparent 85%);opacity:.65}
    .hero-content{position:relative;z-index:8;grid-column:1;grid-row:1;align-self:center;padding:120px 0 80px 5vw;max-width:820px}
    .hero-content h1.hero-title{
      display:block!important;width:100%!important;max-width:1100px!important;
      margin:25px 0 0!important;font-family:"Google Sans Flex",sans-serif!important;
      font-size:48px!important;line-height:1.15!important;opacity:1!important;visibility:visible!important;letter-spacing:-1.5px!important;
      font-weight:600!important;color:#111827!important;
      white-space:normal!important;
    }
    .hero-content h1.hero-title .hero-line{display:block!important;opacity:1!important;visibility:visible!important;transform:none;will-change:auto;}
    .hero-content h1.hero-title .hero-line{animation:heroEnter .7s cubic-bezier(.22,1,.36,1) both!important;}
    .hero-content h1.hero-title .hero-line:nth-child(1){animation-delay:.15s!important;}
    .hero-content h1.hero-title .hero-line:nth-child(2){animation-delay:.3s!important;}
    @keyframes heroEnter{from{opacity:0;transform:translate(24px,24px);filter:blur(5px)}to{opacity:1;transform:translate(0,0);filter:blur(0)}}
    
    /* Smooth multi-stop gradient matching the screenshot preview */
    .hero-content h1.hero-title .highlight-red-orange {
      background: linear-gradient(110deg, #111827 0%, #253247 25%, #dc2626 65%, #f97316 100%)!important;
      -webkit-background-clip: text!important;
      background-clip: text!important;
      -webkit-text-fill-color: transparent!important;
    }
    
    /* Explore Products button */
    .animated-button{position:relative;display:flex;align-items:center;justify-content:center;box-sizing:border-box;gap:4px;padding:16px 36px;border:2px solid #dc2626;border-radius:12px;font-size:16px;background:#111;font-weight:600;color:#fff;box-shadow:none;cursor:pointer;overflow:hidden;transition:all .6s cubic-bezier(.23,1,.32,1)}
    .animated-button svg{position:absolute;width:24px;fill:#dc2626;z-index:9;transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button .arr-1{right:16px}.animated-button .arr-2{left:-25%}
    .animated-button .circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;background-color:#dc2626;border-radius:50%;opacity:0;transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button .text{position:relative;z-index:1;transform:translateX(-12px);transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button:hover{box-shadow:0 0 0 12px transparent;color:#212121;border-radius:12px}
    .animated-button:hover .arr-1{right:-25%}.animated-button:hover .arr-2{left:16px}.animated-button:hover .text{transform:translateX(12px)}
    .animated-button:hover svg{fill:#212121}.animated-button:active{scale:.95;box-shadow:0 0 0 4px #dc2626}
    .animated-button:hover .circle{width:220px;height:220px;opacity:1}

    /* About image diagonal top-left reveal */

    .hero-copy .hero-copy-line{display:block!important;white-space:nowrap!important;}
    .actions{display:flex;gap:20px;margin-top:36px}
    .btn{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      min-width:190px;
      height:58px;
      padding:0 25px;

    }
    .btn-red{
      background:#111!important;

      box-shadow:0 0 0 1px rgba(217,56,48,.18),0 10px 30px rgba(16,16,16,.12)!important;

      height:25px;

    }
    .btn-red:hover:before{transform:translateX(130%)}
    .btn-red:hover:after{transform:translate(3px,-2px);background:rgba(255,255,255,.12)}
    .btn-red:active{transform:translateY(-1px) scale(.98)}
    .btn-outline{
      background:transparent!important;
      color:#111!important;
      border:1px solid rgba(16,16,16,.24)!important;

    /* Hero Video Showcase - No border & BG removed via blend-mode */
    .hero-video-visual{

    .marquee{overflow:hidden!important;width:100%!important;padding:20px 0!important;background:#f4f0e8!important;font-family:"Poppins",sans-serif!important;}
    .marquee-track{display:flex!important;align-items:center!important;width:max-content!important;min-width:100%!important;gap:0!important;white-space:nowrap!important;font-family:"Unbounded",sans-serif!important;font-size:22px!important;font-weight:750!important;letter-spacing:.2px!important;text-transform:uppercase!important;line-height:1!important;}

    .marquee-track span:before{content:"•"!important;display:inline-block!important;margin-right:28px!important;color:#101010!important;font-family:"Unbounded",sans-serif!important;font-size:22px!important;font-weight:900!important;line-height:1!important;}

    /* ============================================================
       04 — ABOUT STYLES
       ============================================================ */
    .section{padding:130px 5vw}
    .dark{background:#111;color:#fff}
    .section-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#89847b;font-weight:700;margin-bottom:28px}

    .about-home-title{font-family:"Poppins",sans-serif;font-size:48px;line-height:1.15;letter-spacing:-1.5px;font-weight:850;color:#111827;margin:0 0 15px 0}

    /* Product card information modal */
.product-info-panel{padding:42px 24px 28px;border-radius:18px;max-height:92vh}.product-info-layout{grid-template-columns:1fr;gap:10px}.product-info-label{padding-top:0}.product-info-title{font-size:38px;letter-spacing:-1.7px}.product-info-meta{grid-template-columns:1fr;gap:24px;margin-top:28px}.product-info-actions{margin-top:28px}.product-info-actions a,.product-info-actions button{flex:1}}

       ============================================================ */
    @media(max-width:900px){
      html,body{overflow-x:hidden!important;width:100%!important;max-width:100%!important;}
      .nav{width:calc(100vw - 18px)!important;max-width:none!important;box-sizing:border-box!important;height:76px!important;padding:0 10px 0 15px!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;border-radius:18px!important}
