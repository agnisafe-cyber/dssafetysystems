  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f4f0e8;--ink:#101010;--muted:#6d6962;--red:#d93830;--line:rgba(16,16,16,.12)}
    html{scroll-behavior:auto}
    body{font-family:"Google Sans Flex",sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    button{font:inherit}
    ::selection{background:var(--red);color:#fff}
  
    /* Navigation Styles */
    .nav{
      position:fixed;z-index:50;top:22px;left:50%;transform:translateX(-50%);
      width:min(1280px,calc(100% - 40px));height:82px;padding:0 22px;
      display:flex;align-items:center;justify-content:space-between;
      background:rgba(244,240,232,.88);border:none;
      border-radius:20px;box-shadow:0 12px 38px rgba(16,16,16,.08);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      font-family:"Poppins",sans-serif!important;
    }
    .brand{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700;letter-spacing:-.6px;min-width:max-content!important;}
    .brand-logo{width:50px;height:50px;object-fit:contain}
    .brand-text{
      font-family:"Poppins",sans-serif!important;
      font-size:26px!important;
      font-weight:750!important;
      letter-spacing:-1.15px!important;
      line-height:1!important;
      white-space:nowrap!important;
      background:linear-gradient(90deg,#d93830 0%,#101010 68%,#101010 100%)!important;
      -webkit-background-clip:text!important;
      background-clip:text!important;
      -webkit-text-fill-color:transparent!important;
      color:transparent!important;
    }
    .nav-links{display:flex;align-items:center;gap:6px;margin-left:auto}
    .nav-links a{font-family:"Poppins",sans-serif!important;font-size:14px;font-weight:600;padding:12px 16px;border-radius:9px;position:relative;transition:.25s}
    .nav-links a:not(.nav-cta):hover{background:rgba(16,16,16,.055);color:var(--red)}
    .nav-links a:not(.nav-cta):after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:1.5px;background:var(--red);transform:scaleX(0);transition:.25s}
    .nav-links a:not(.nav-cta):hover:after{transform:scaleX(1)}
    .nav-cta{background:#111;color:#fff!important;border-radius:999px!important;padding:13px 21px!important;margin-left:7px}
    .nav-cta:hover{background:var(--red)!important;transform:translateY(-1px)}
    .menu{display:none}

    /* Hero Section Styles */
    .hero{min-height:100svh;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr;column-gap:32px;align-items:center;background:radial-gradient(circle at 76% 48%,rgba(217,56,48,.055),transparent 24%)}
    .hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(16,16,16,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(16,16,16,.035) 1px,transparent 1px);background-size:70px 70px;mask-image:linear-gradient(to bottom,#000 0%,transparent 85%);opacity:.65}
    .hero-content{position:relative;z-index:8;grid-column:1;grid-row:1;align-self:center;padding:120px 0 80px 5vw;max-width:820px}
    .hero-content h1.hero-title{
      display:block!important;width:100%!important;max-width:1100px!important;
      margin:25px 0 0!important;font-family:"Google Sans Flex",sans-serif!important;
      font-size:48px!important;line-height:1.15!important;opacity:1!important;visibility:visible!important;letter-spacing:-1.5px!important;
      font-weight:600!important;color:#111827!important;
      white-space:normal!important;
    }
    .hero-content h1.hero-title .hero-line{display:block!important;opacity:1!important;visibility:visible!important;transform:none;will-change:auto;}
    .hero-content h1.hero-title .hero-line{animation:heroEnter .7s cubic-bezier(.22,1,.36,1) both!important;}
    .hero-content h1.hero-title .hero-line:nth-child(1){animation-delay:.15s!important;}
    .hero-content h1.hero-title .hero-line:nth-child(2){animation-delay:.3s!important;}
    @keyframes heroEnter{from{opacity:0;transform:translateY(22px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
    
    /* Smooth multi-stop gradient matching the screenshot preview */
    .hero-content h1.hero-title .highlight-red-orange {
      background: linear-gradient(110deg, #111827 0%, #253247 25%, #dc2626 65%, #f97316 100%)!important;
      -webkit-background-clip: text!important;
      background-clip: text!important;
      -webkit-text-fill-color: transparent!important;
    }
    
    /* Explore Products button */
    .animated-button{position:relative;display:flex;align-items:center;gap:4px;padding:16px 36px;border:4px solid;border-color:transparent;font-size:16px;background-color:inherit;border-radius:100px;font-weight:600;color:greenyellow;box-shadow:0 0 0 2px greenyellow;cursor:pointer;overflow:hidden;transition:all .6s cubic-bezier(.23,1,.32,1)}
    .animated-button svg{position:absolute;width:24px;fill:greenyellow;z-index:9;transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button .arr-1{right:16px}.animated-button .arr-2{left:-25%}
    .animated-button .circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;background-color:greenyellow;border-radius:50%;opacity:0;transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button .text{position:relative;z-index:1;transform:translateX(-12px);transition:all .8s cubic-bezier(.23,1,.32,1)}
    .animated-button:hover{box-shadow:0 0 0 12px transparent;color:#212121;border-radius:12px}
    .animated-button:hover .arr-1{right:-25%}.animated-button:hover .arr-2{left:16px}.animated-button:hover .text{transform:translateX(12px)}
    .animated-button:hover svg{fill:#212121}.animated-button:active{scale:.95;box-shadow:0 0 0 4px greenyellow}
    .animated-button:hover .circle{width:220px;height:220px;opacity:1}

    /* Hero Copy & Actions */
    .hero-copy{font-size:35px!important;max-width:900px!important;line-height:1.45!important;color:#2c333f!important;font-weight:550!important;margin-top:36px;margin-bottom:20px}
    .hero-copy .hero-copy-line{display:block!important;white-space:nowrap!important;}
    .actions{display:flex;gap:20px;margin-top:36px}
    .btn{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      min-width:190px;
      height:58px;
      padding:0 25px;
      border-radius:10px!important;
      font-family:"Poppins",sans-serif!important;
      font-size:13px!important;
      font-weight:700!important;
      letter-spacing:.1px;
      text-decoration:none;
      transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,background .35s ease,color .35s ease;
      overflow:hidden;
      isolation:isolate;
    }
    .btn-red{
      background:#111!important;
      color:#fff!important;
      border:1px solid rgba(217,56,48,.9)!important;
      box-shadow:0 0 0 1px rgba(217,56,48,.18),0 10px 30px rgba(16,16,16,.12)!important;
    }
    .btn-red:before{
      content:"";
      position:absolute;
      inset:-2px;
      z-index:-1;
      background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.8) 48%,transparent 62%);
      transform:translateX(-130%);
      transition:transform .8s cubic-bezier(.22,1,.36,1);
    }
    .btn-red:after{
      content:"↗";
      display:grid;
      place-items:center;
      width:25px;
      height:25px;
      border:1px solid rgba(255,255,255,.32);
      border-radius:50%;
      font-size:13px;
      transition:transform .35s cubic-bezier(.22,1,.36,1),background .35s ease;
    }
    .btn-red:hover{
      background:#dc2626!important;
      color:#fff!important;
      transform:translateY(-3px);
      box-shadow:0 0 0 1px rgba(217,56,48,.55),0 14px 36px rgba(217,56,48,.2)!important;
    }
    .btn-red:hover:before{transform:translateX(130%)}
    .btn-red:hover:after{transform:translate(3px,-2px);background:rgba(255,255,255,.12)}
    .btn-red:active{transform:translateY(-1px) scale(.98)}
    .btn-outline{
      background:transparent!important;
      color:#111!important;
      border:1px solid rgba(16,16,16,.24)!important;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
    }
    .btn-outline:hover{
      background:#111!important;
      color:#fff!important;
      border-color:#111!important;
      transform:translateY(-3px);
      box-shadow:0 12px 30px rgba(16,16,16,.14);
    }

    /* Hero Video Showcase - No border & BG removed via blend-mode */
    .hero-video-visual{
      position:relative;z-index:5;grid-column:2;grid-row:1;align-self:center;justify-self:center;
      width:min(46vw,600px);aspect-ratio:4 / 3;height:auto;
      transform:translateY(0);border-radius:18px;background:transparent!important;
      border:none!important;box-shadow:none!important;
      overflow:visible!important;isolation:isolate;
    }
    .hero-video-visual:before{content:"";display:none!important;}
    .hero-video{
      position:absolute;inset:0;z-index:1!important;width:100%;height:100%;
      object-fit:cover;display:block;border-radius:18px;background:transparent!important;
      mix-blend-mode:multiply;
    }
    .hero-video-glow{
      position:absolute!important;inset:-24px!important;width:auto!important;height:auto!important;
      border-radius:22px!important;background:transparent!important;
      box-shadow:0 0 18px rgba(217,56,48,.35),0 0 42px rgba(217,56,48,.15)!important;
      z-index:0!important;pointer-events:none!important;
    }

    /* Marquee */
    .marquee{overflow:hidden!important;width:100%!important;padding:20px 0!important;background:#f4f0e8!important;font-family:"Poppins",sans-serif!important;}
    .marquee-track{display:flex!important;align-items:center!important;width:max-content!important;min-width:100%!important;gap:0!important;white-space:nowrap!important;font-family:"Unbounded",sans-serif!important;font-size:22px!important;font-weight:750!important;letter-spacing:.2px!important;text-transform:uppercase!important;line-height:1!important;}
    .marquee-track span{display:inline-flex!important;align-items:center!important;flex:0 0 auto!important;margin:0!important;padding:0 30px!important;}
    .marquee-track span:before{content:"•"!important;display:inline-block!important;margin-right:28px!important;color:#101010!important;font-family:"Unbounded",sans-serif!important;font-size:22px!important;font-weight:900!important;line-height:1!important;}

    /* About Section */
    .section{padding:130px 5vw}
    .dark{background:#111;color:#fff}
    .section-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#89847b;font-weight:700;margin-bottom:28px}
    .about-home{background:rgba(244,240,232,.84);padding-top:120px;padding-bottom:120px}
    .about-home-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:center}
    .about-home-copy{max-width:680px}
    .about-home-title{font-family:"Poppins",sans-serif;font-size:48px;line-height:1.15;letter-spacing:-1.5px;font-weight:850;color:#111827;margin:0 0 15px 0}
    .about-home-title span{color:#dc2626}
    .about-home-text{color:#2a313d;font-size:16.5px;line-height:1.8;max-width:600px;margin-top:25px;margin-bottom:25px;font-weight:500}
    .about-home-image{min-height:520px;border-radius:28px;overflow:hidden;background:#171717;position:relative;box-shadow:0 28px 80px rgba(16,16,16,.16)}
    .about-home-image img{width:100%;height:100%;min-height:520px;object-fit:cover;display:block}
    .about-home-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:50px}
    .about-home-facts>div{display:flex;align-items:center;gap:10px;padding:6px 0;font-family:"Poppins",sans-serif;font-size:16px;font-weight:650;color:#1f2937}
    .about-home-facts>div:before{content:"✓";display:grid;place-items:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:#dc2626;color:#fff;font-size:13px;font-weight:700;line-height:1}

    /* Cards & Products */
    .statement{font-size:clamp(42px,6.5vw,92px);line-height:1.05;letter-spacing:-4px;font-weight:750;max-width:1050px;margin-bottom:20px}
    .statement span{color:var(--red)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:transparent;margin-top:90px}
    .card{background:#111;padding:40px;min-height:290px;display:flex;flex-direction:column;justify-content:space-between}
    .card-num{font-size:11px;color:#777;letter-spacing:1px}
    .card h3{font-size:27px;letter-spacing:-1px;font-weight:750;margin-bottom:12px}
    .card p{color:#ababab;font-size:14.5px;line-height:1.7;max-width:280px;margin-top:8px}
    .card-arrow{color:var(--red);font-size:24px}
    
    .products{background:var(--bg)}
    .product-intro{display:flex;justify-content:space-between;gap:40px;align-items:end}
    .product-intro h2{font-size:clamp(42px,6vw,80px);letter-spacing:-4px;line-height:1.02;font-weight:750}
    .product-intro p{max-width:330px;color:#2a313d;line-height:1.65;font-size:15px;font-weight:500;margin-bottom:10px}
    .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:60px}
    .product{min-height:360px;background:#ebe6dc;border:none;padding:28px;position:relative;overflow:hidden;transition:transform .35s}
    .product:hover{transform:translateY(-7px)}
    .product-num{font-size:11px;color:#777}
    .product h3{font-size:25px;letter-spacing:-1px;position:absolute;bottom:27px;left:28px;right:28px;font-weight:750}
    .product-visual{height:180px;display:grid;place-items:center;font-size:75px;filter:drop-shadow(0 20px 25px rgba(0,0,0,.12))}
    .product-link{position:absolute;top:26px;right:26px;width:36px;height:36px;border:none;background:rgba(16,16,16,.05);border-radius:50%;display:grid;place-items:center}

    /* Contact Section */
    .contact-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:50px;margin-top:65px}
    .contact-box{border:none;padding:35px;border-radius:22px;background:rgba(255,255,255,.025)}
    .contact-box a{display:block;font-size:22px;font-weight:700;margin-top:16px}
    .contact-box a:hover{color:var(--red)}
    .contact-label{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#777;font-weight:700}
    .contact-box p{color:#ababab;line-height:1.7;margin-top:16px;font-size:14px}
    
    .footer{padding:35px 5vw;display:flex;justify-content:space-between;gap:20px;border-top:none;font-size:12px;color:#777}

    /* Responsive Media Queries */
    @media(max-width:900px){
      .nav{width:calc(100% - 18px)!important;height:76px!important;padding:0 10px 0 15px!important;border-radius:18px!important}
      .brand-logo{width:44px!important;height:44px!important}
      .brand-text{font-size:20px!important}
      .menu{display:block;border:0;background:#111;color:#fff;width:46px!important;height:46px!important;border-radius:12px;font-size:0;position:relative}
      .menu:before,.menu:after{content:"";position:absolute;left:12px;width:18px;height:1.5px;background:#fff;transition:.25s}
      .menu:before{top:16px}.menu:after{top:24px}
      .menu.open:before{top:20px;transform:rotate(45deg)}.menu.open:after{top:20px;transform:rotate(-45deg)}
      .nav-links{display:none}
      .nav-links.mobile-open{display:flex;position:absolute;top:78px;left:0;right:0;padding:10px;flex-direction:column;align-items:stretch;gap:4px;background:rgba(244,240,232,.96);border:none;border-radius:20px;backdrop-filter:blur(25px)}
      .nav-links.mobile-open a{padding:14px 15px}
      
      .hero{min-height:auto!important;height:auto!important;display:flex!important;flex-direction:column!important;padding-bottom:0!important}
      .hero-content{grid-column:auto!important;grid-row:auto!important;padding:120px 16px 40px!important;max-width:none!important}
      .hero-video-visual{grid-column:auto!important;grid-row:auto!important;position:relative!important;width:calc(100% - 32px)!important;aspect-ratio:16/10!important;margin:35px 16px 65px!important;transform:none!important}
      .hero-content h1.hero-title{font-size:32px!important;}
      .hero-copy{font-size:20px!important;max-width:100%!important;white-space:normal!important}
      .actions{gap:12px!important}
      .actions .btn{min-width:0!important;height:54px!important;padding:0 18px!important;font-size:12px!important}
      .about-home-grid{grid-template-columns:1fr;gap:45px}
      .cards,.product-grid{grid-template-columns:1fr}
      .contact-grid{grid-template-columns:1fr;gap:14px;margin-top:40px}
    }
  </style>
</head>

  <script>
    const {useEffect} = React;
    function App(){
      useEffect(()=>{

        gsap.set(nav,{y:-35,opacity:0});
        gsap.set([logo,brand.querySelector(".brand-text"),...navLinks,menu],{y:18,opacity:0});
        
        const navIntro = gsap.timeline({delay:.15,defaults:{ease:"power3.out"}});
        navIntro.to(nav,{y:0,opacity:1,duration:.7})
                .to(logo,{y:0,opacity:1,duration:.5},"-=.35")
                .to(brand.querySelector(".brand-text"),{y:0,opacity:1,duration:.5},"-=.4")

        let compact = false;
        ScrollTrigger.create({start:20,onUpdate:self=>{
          const next = self.scroll()>20;
          if(next!==compact){
            compact = next;
            gsap.to(nav,{height:next?68:82,duration:.35,ease:"power2.out"});
            gsap.to(logo,{width:next?44:50,height:next?44:50,duration:.35,ease:"power2.out"});
          }
        }});

        menu.addEventListener("click",()=>{
          const open = linksWrap.classList.contains("mobile-open");
          linksWrap.classList.toggle("mobile-open",!open);
          menu.classList.toggle("open",!open);
          if(!open) gsap.fromTo(linksWrap,{opacity:0,y:-12},{opacity:1,y:0,duration:.35,ease:"power3.out"});
        });

        const smoother = ScrollSmoother.create({wrapper:"#smooth-wrapper",content:"#smooth-content",smooth:1.15,effects:true,smoothTouch:0.12,normalizeScroll:true});
        
        const heroLines = gsap.utils.toArray(".hero-title .hero-line");
                gsap.set(".hero-copy",{opacity:0,y:18});
        gsap.set(".actions",{opacity:0,y:18});
        
        const tl = gsap.timeline({defaults:{ease:"power3.out"}});
        tl.fromTo(".nav",{opacity:0,y:-18},{opacity:1,y:0,duration:.65})
          
          .to(".hero-copy",{opacity:1,y:0,duration:.65},"-=.28")
          .to(".actions",{opacity:1,y:0,duration:.5},"-=.3")
          .fromTo(".hero-video-visual",{x:70,opacity:0,scale:.97},{x:0,opacity:1,scale:1,duration:.9},"-=.9");

        gsap.to(".marquee-track",{xPercent:-33.333,duration:22,ease:"none",repeat:-1});

        return ()=>{ if(smoother) smoother.kill(); ScrollTrigger.getAll().forEach(t=>t.kill()); };
      },[]);

      return React.createElement(React.Fragment,null,
        React.createElement("nav",{className:"nav"},
          React.createElement("a",{className:"brand",href:"#"},
            React.createElement("img",{className:"brand-logo",src:"DSF_logo_small.png",alt:"DS Safety Systems"}),
            React.createElement("span",{className:"brand-text"},"DS Safety Systems")
          ),
          React.createElement("div",{className:"nav-links"},
            React.createElement("a",{href:"products.html"},"Products"),
            React.createElement("a",{href:"services.html"},"Services"),
            React.createElement("a",{href:"#about"},"About"),
            React.createElement("a",{href:"contact.html"},"Contact"),
            React.createElement("a",{className:"nav-cta",href:"contact.html"},"Get a quote")
          ),
          React.createElement("button",{className:"menu","aria-label":"Menu"},"☰")
        ),
        React.createElement("main",null,
          React.createElement("section",{className:"hero"},
            React.createElement("div",{className:"hero-grid"}),
            React.createElement("div",{className:"hero-content"},
              React.createElement("h1",{className:"hero-title"},
                React.createElement("span",{className:"hero-line"},"Industrial Fire ",React.createElement("span",{className:"highlight-red-orange"},"Safety,")),
                React.createElement("span",{className:"hero-line"},"Engineered ",React.createElement("span",{className:"highlight-red-orange"},"Protection"))
              ),
              React.createElement("p",{className:"hero-copy"},
                React.createElement("span",{className:"hero-copy-line"},"Fire protection equipment and safety solutions"),
